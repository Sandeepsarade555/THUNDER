name: Ek Minute reel

on:
  schedule:
    - cron: "30 2 * * *"    # 08:00 IST
    - cron: "30 12 * * *"   # 18:00 IST
  workflow_dispatch:         # "Run workflow" button for a reel right now

permissions:
  contents: write

concurrency:
  group: reel
  cancel-in-progress: false

