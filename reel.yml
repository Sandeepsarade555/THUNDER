          tar xzf /tmp/bot.tgz -C .
          mkdir -p engine/fonts
          G=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -sfL -o engine/fonts/Anton-Regular.ttf "$G/anton/Anton-Regular.ttf"
          curl -sfL -o engine/fonts/Oswald.ttf "$G/oswald/Oswald%5Bwght%5D.ttf"
          curl -sfL -o engine/fonts/LibreBaskerville.ttf "$G/librebaskerville/LibreBaskerville%5Bwght%5D.ttf"
          python3 - <<'PY'
          import base64
          F=[("Anton","Anton-Regular.ttf","400"),("Oswald","Oswald.ttf","200 700"),("Libre Baskerville","LibreBaskerville.ttf","400 700")]
          css="".join("@font-face{font-family:'%s';src:url(data:font/ttf;base64,%s) format('truetype');font-weight:%s;}"%(n,base64.b64encode(open("engine/fonts/"+f,"rb").read()).decode(),w) for n,f,w in F)
          open("engine/fonts.css","w").write(css)
          PY
          git config user.name "ek-minute-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Install Ek Minute bot"
          git push

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Make and post the reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          IG_HANDLE: "@ek_minute60s"
          VOICE: hi-IN-SwaraNeural
        run: python bot/run.py

      - name: Save the reel file (downloadable for 7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Remember the topic (so it never repeats)
        if: success()
        run: |
          git config user.name "ek-minute-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted.txt
          git commit -m "posted: $(tail -n1 posted.txt | cut -c1-60)" || true
          git push
